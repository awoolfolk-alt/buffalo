<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Crew Chronicle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&family=Comic+Neue:wght@700&family=Bangers&display=swap">
<style>
/* Layout: one long vertical scroll of aged newspaper sheets on a dark desk — A1 front page, A2 breaking news, C1 the funnies (vintage B&W strips), M1 manga webtoon supplement. Single committed look: aged newsprint, black ink, one red, one gold. */
:root{
  --desk:#24201C; --paper:#EFE5CF; --paper-2:#E6DABF; --ink:#1A1714; --muted:#4F483D; --rule:#1A1714;
  --red:#A3261B; --gold:#D9A93B; --green:#1E5B33;
  --black:'UnifrakturMaguntia', 'Old English Text MT', serif;
  --head:'Playfair Display', Georgia, serif;
  --body:'Source Serif 4', Georgia, serif;
  --type:'Special Elite', 'Courier New', monospace;
  --letter:'Comic Neue', 'Comic Sans MS', sans-serif;
  --sfx:'Bangers', Impact, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.2px);background-size:6px 6px;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
.wrap{display:flex;flex-direction:column;align-items:center;gap:56px;padding-block:28px 72px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.jump{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.jump a{font:600 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#E9DFC9;text-decoration:none;border:1px solid #5A5146;border-radius:2px;padding:6px 12px}
.jump a:hover,.jump a:focus-visible{background:#E9DFC9;color:var(--desk);outline:none}
.sheet{position:relative;width:100%;max-width:980px;background:var(--paper);background-image:radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 60%),radial-gradient(ellipse at 90% 95%, rgba(120,90,40,.16), transparent 55%);padding:34px clamp(16px,4vw,44px) 44px;box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:18px}
.tape{position:absolute;width:120px;height:30px;background:rgba(217,169,59,.55);border-left:2px dashed rgba(255,255,255,.4);border-right:2px dashed rgba(255,255,255,.4);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.folio{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:6px}
.rule2{border:0;border-top:3px double var(--rule);margin:0}
.rule1{border:0;border-top:1px solid var(--rule);margin:0}
p{margin:0}
/* ---------- A1 masthead ---------- */
.mast{display:grid;grid-template-columns:150px 1fr 150px;gap:14px;align-items:center}
@media (max-width:720px){.mast{grid-template-columns:1fr}.ear{display:none}}
.ear{border:3px double var(--rule);padding:8px;font-size:13px;line-height:1.35;text-align:center}
.ear b{display:block;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase}
.title{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.title h1{font-family:var(--black);font-weight:400;font-size:clamp(44px,9vw,96px);line-height:1;margin:0;color:var(--ink);text-shadow:2px 2px 0 rgba(217,169,59,.55)}
.motto{font:italic 15px var(--body);color:var(--muted)}
.dateline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:6px 0;font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase}
.kicker{font:700 13px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.hed{font-family:var(--head);font-weight:900;font-size:clamp(32px,5.6vw,58px);line-height:1.04;margin:0;text-wrap:balance}
.dek{font:italic 20px/1.4 var(--body);color:#3A342B}
.by{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.leadfig{float:right;width:min(54%,500px);margin:4px 0 12px 22px;display:flex;flex-direction:column;gap:6px}
.leadfig svg{width:100%;height:auto;display:block;filter:grayscale(1) sepia(.35) contrast(1.18)}
.leadfig .frame{border:2px solid var(--rule);padding:6px;background:#F6EEDC}
.cutline{font:italic 14px/1.4 var(--body);color:var(--muted)}
@media (max-width:720px){.leadfig{float:none;width:100%;margin:0 0 12px}}
.story p+p{margin-top:.8em}
.dropcap::first-letter{float:left;font-family:var(--head);font-weight:900;font-size:4.4em;line-height:.78;padding:6px 8px 0 0}
.clear{clear:both}
.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:3px double var(--rule)}
@media (max-width:720px){.briefs{grid-template-columns:minmax(0,1fr)}}
.briefs div{padding:12px 14px;border-right:1px solid var(--rule);font-size:15px;line-height:1.45}
.briefs div:last-child{border-right:0}
.briefs h3{font:900 18px var(--head);margin:0 0 4px}
.index{display:flex;flex-wrap:wrap;gap:6px 18px;border:2px solid var(--rule);padding:8px 12px;font-size:15px}
.index b{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase}
/* ---------- A2 breaking ---------- */
.band{background:var(--red);color:#FFF6E6;font:900 clamp(22px,4vw,34px) var(--head);letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.band span{font:700 12px var(--body);letter-spacing:.16em}
.cols{column-count:2;column-gap:34px;column-rule:1px solid var(--rule)}
@media (max-width:720px){.cols{column-count:1}}
.cols h3{font:900 21px/1.2 var(--head);margin:1em 0 .3em;break-after:avoid}
.cols h3:first-child{margin-top:0}
.cols p+p{margin-top:.7em}
.pull{break-inside:avoid;border-top:3px solid var(--red);border-bottom:3px solid var(--red);padding:10px 0;margin:14px 0;font:italic 700 23px/1.3 var(--head)}
.pull small{display:block;font:700 12px var(--body);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:6px}
.roster{break-inside:avoid;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.roster div{border-left:4px solid var(--ink);padding:2px 0 2px 10px;font-size:16px;line-height:1.45}
.roster b{font-family:var(--head)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.playbill{border:3px double var(--rule);padding:14px;background:#F6EEDC}
.playbill h3{font:900 22px var(--head);text-align:center;margin:0 0 2px}
.playbill .sub{text-align:center;font:italic 14px var(--body);color:var(--muted);margin-bottom:8px}
.playbill ul{list-style:none;margin:0;padding:0;font-size:15px}
.playbill li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--muted);padding:4px 0}
.playbill li span:last-child{text-align:right;color:var(--muted)}
.script{background:#FBF7EC;border:1px solid var(--muted);padding:16px 18px;font-family:var(--type);font-size:15px;line-height:1.55;box-shadow:3px 3px 0 rgba(0,0,0,.15)}
.script .slug{font-weight:700;text-transform:uppercase}
.script .char{text-align:center;margin-top:10px;text-transform:uppercase}
.script .line{text-align:center;margin:0 10%}
.script .dir{margin-top:8px;font-style:italic}
.script .trans{text-align:right;margin-top:10px;text-transform:uppercase}
/* ---------- C1 funnies ---------- */
.funnies-head{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--ink);padding-bottom:6px}
.funnies-head h2{font-family:var(--sfx);font-weight:400;font-size:clamp(48px,9vw,86px);line-height:.9;letter-spacing:.04em;margin:0;color:#FFFFFF;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.funnies-head p{font:700 13px var(--body);letter-spacing:.16em;text-transform:uppercase}
.strip{display:flex;flex-direction:column;gap:6px}
.strip-title{display:flex;align-items:center;gap:10px}
.strip-title b{font:700 22px var(--letter);text-transform:uppercase;letter-spacing:.04em;border:3px solid var(--ink);background:#FFFFFF;padding:2px 12px}
.strip-title span{font:italic 14px var(--body);color:var(--muted)}
.panels{display:grid;gap:8px}
.p4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.p4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sunday{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto}
.sunday .big{grid-column:span 2;grid-row:span 2}
.sunday .wide{grid-column:1 / -1}
@media (max-width:720px){.sunday{grid-template-columns:minmax(0,1fr)}.sunday .big,.sunday .wide{grid-column:auto;grid-row:auto}}
.cp{position:relative;border:3px solid var(--ink);background:#FFFFFF;height:250px;overflow:hidden}
.cp.tall{height:100%;min-height:250px}
.cp.hatch{background:repeating-linear-gradient(45deg,#FFFFFF 0 6px,#E9E9E9 6px 7px)}
.cp.dots{background-color:#FFFFFF;background-image:radial-gradient(#CFCFCF 1.2px, transparent 1.4px);background-size:7px 7px}
.cp svg.st{position:absolute;inset:0;width:100%;height:100%;filter:grayscale(1) contrast(1.25)}
.cap{position:absolute;left:0;top:0;max-width:78%;background:#FFF8D8;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);font:700 12px/1.25 var(--letter);text-transform:uppercase;padding:4px 7px;z-index:2}
.bal{position:absolute;z-index:3;background:#FFFFFF;border:2px solid var(--ink);border-radius:50%;padding:8px 12px;font:700 13px/1.15 var(--letter);text-transform:uppercase;text-align:center;max-width:62%}
.bal::after{content:"";position:absolute;width:0;height:0;border:9px solid transparent}
.bal.dl::after{left:22%;bottom:-17px;border-top:10px solid var(--ink)}
.bal.dr::after{right:22%;bottom:-17px;border-top:10px solid var(--ink)}
.bal.think{border-radius:40%;border-style:dashed}
.boxscore{border:3px double var(--ink);background:#F6EEDC;padding:12px 14px}
.boxscore h3{font:900 22px var(--head);margin:0 0 2px}
.boxscore .sub{font:italic 14px var(--body);color:var(--muted);margin-bottom:8px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;text-align:left;border-bottom:2px solid var(--ink);padding:5px 6px}
td{border-bottom:1px dotted var(--muted);padding:6px;vertical-align:top}
td.m{color:var(--green);font-weight:600}
/* ---------- M1 manga ---------- */
.manga{background:#0F0F10;color:#F2F2F2;max-width:720px}
.manga .folio{color:#A9A9A9;border-color:#444}
.mpanel{position:relative;border:4px solid #F2F2F2;background:#FFFFFF;color:#111;overflow:hidden;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.mpanel.flip .mart{order:2}
@media (max-width:560px){.mpanel{grid-template-columns:minmax(0,1fr)}.mpanel.flip .mart{order:0}}
.mpanel.speed{background:repeating-conic-gradient(from 0deg at 50% 50%, #FFFFFF 0deg 2deg, #E3E3E3 2deg 3.6deg)}
.mpanel.tone{background-color:#FFFFFF;background-image:radial-gradient(#C9C9C9 1.3px, transparent 1.5px);background-size:8px 8px}
.mart svg{width:100%;height:auto;display:block;filter:grayscale(1) contrast(1.2)}
.mart.gold svg{filter:none}
.mtext{display:flex;flex-direction:column;gap:8px;min-width:0}
.codename{font:400 30px/1 var(--sfx);letter-spacing:.05em}
.mlabel{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#555}
.mbox{background:#111;color:#F2F2F2;padding:8px 10px;font-size:15px;line-height:1.4}
.mbubble{background:#FFFFFF;border:3px solid #111;border-radius:50%;padding:14px 18px;font:400 22px/1.1 var(--sfx);letter-spacing:.04em;text-align:center}
.msfx{position:absolute;top:8px;right:12px;font:400 44px/1 var(--sfx);color:#FFFFFF;-webkit-text-stroke:3px #111;paint-order:stroke fill;transform:rotate(-8deg)}
.splash{border:4px solid #F2F2F2;background:#111;padding:40px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
.splash h2{font:400 clamp(44px,10vw,76px)/1 var(--sfx);letter-spacing:.06em;margin:0;color:#FFFFFF}
.splash p{color:#BDBDBD;font-style:italic}
.draft{align-self:center;font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#111;background:var(--gold);padding:4px 10px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed #8A8070;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 10px,rgba(0,0,0,.035) 10px 20px);color:#5B5346;padding:10px;min-width:0}
.slot span{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase}
.slot small{font:italic 14px/1.3 var(--body);max-width:30ch}
.slot em{font:12px var(--body);color:#7A7062}
.slot.fill{position:absolute;inset:6px}
.slot.wide{aspect-ratio:760/370;width:100%}
.slot.square{aspect-ratio:1/1;width:100%}
.corr-pic .slot.fill{inset:0;padding:4px}
.corr-pic .slot small,.corr-pic .slot em{display:none}
.mpanel .slot{background:repeating-linear-gradient(135deg,#FFFFFF 0 10px,#EDEDED 10px 20px);color:#444}
.splash .slot{color:#BDBDBD;border-color:#666;background:repeating-linear-gradient(135deg,#161616 0 10px,#1F1F1F 10px 20px)}
.corr{display:flex;gap:14px;align-items:center;border:2px solid var(--rule);background:#F6EEDC;padding:10px 12px;max-width:560px}
.corr-pic{position:relative;flex:none;width:110px;height:84px;border:2px solid var(--rule);background:#FFFFFF;overflow:hidden}
.corr-pic svg.st{filter:grayscale(1) sepia(.3) contrast(1.15)}
.corr-name{font:900 22px var(--head)}
.corr-bio{font-size:14px;line-height:1.45;color:var(--muted)}
.refs{display:flex;flex-direction:column;gap:0;border-top:3px double var(--rule)}
.ref{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.ref .n{font:900 22px var(--head);color:var(--red)}
.ref h3{font:900 18px var(--head);margin:0}
.ref p{font-size:15px;line-height:1.45}
.ref .credit{font-style:italic}
.ref a{color:var(--ink);word-break:break-all}
.credits{max-width:980px;color:#B9AE99;font-size:14px;line-height:1.6;text-align:center}
.credits b{color:#E9DFC9}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.headcrop{position:absolute;width:80px;height:80px;z-index:2;filter:grayscale(1) contrast(1.15);border:2.5px solid var(--ink);border-radius:50%;background:#FFFFFF}
.ink-layer :not(.keep):not(text){stroke:#1B1B1B;stroke-width:4.5px;stroke-linejoin:round;stroke-linecap:round}
</style>
</head>
<body>


<div class="wrap">
  <nav class="jump" aria-label="Sections"><a href="#front">A1 Front Page</a><a href="#breaking">A2 Breaking News</a><a href="#funnies">C1 The Funnies</a><a href="#manga">M1 Manga Supplement</a><a href="#references">Picture Credits</a></nav>
  <div id="paper" style="display:contents"></div>
</div>

<script>
const PAIRS = {
  voice:  {label:'The Voice',     main:'#2F6FB3', light:'#DCE9F5', dark:'#1D4A7A'},
  compass:{label:'The Compass',   main:'#E8BE4F', light:'#FBE7A1', dark:'#8A6420'},
  launch: {label:'The Launchpad', main:'#3E8E5E', light:'#DDEFD9', dark:'#24603D'},
  lab:    {label:'The Lab',       main:'#D96C7E', light:'#F6DDD5', dark:'#9C3A4C'}
};
const INK = '#1B1B1B';
const star = (cx,cy,r,fill) => { let p=[]; for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2; const rr=i%2?r*0.45:r; p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));} return `<polygon points="${p.join(' ')}" fill="${fill}"/>`; };
const heart = (cx,cy,s,fill) => `<path transform="translate(${cx} ${cy}) scale(${s})" d="M0 16 C-18 2 -20 -14 -8 -16 C-3 -17 0 -12 0 -8 C0 -12 3 -17 8 -16 C20 -14 18 2 0 16Z" fill="${fill}"/>`;
const CAP = 'M58 74 Q60 36 100 36 Q140 36 142 74 Q128 58 100 58 Q72 58 58 74Z';

function hair(style, c){
  switch(style){
    case 'short': return {back:'', front:`<path d="M56 80 Q54 32 100 30 Q146 32 144 80 Q138 58 120 54 Q100 62 80 54 Q62 58 56 80Z" fill="${c}"/>`};
    case 'puff':  return {back:`<circle cx="100" cy="62" r="56" fill="${c}"/>`, front:`<path d="${CAP}" fill="${c}"/>`};
    case 'curly': return {back:'', front:[ [62,60,16],[76,46,16],[94,38,17],[112,38,17],[128,46,16],[140,60,15] ].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join('')};
    case 'bun':   return {back:`<circle cx="100" cy="30" r="19" fill="${c}"/>`, front:`<path d="${CAP}" fill="${c}"/>`};
    case 'locs':  return {back:[46,58,70,130,142,154].map((x,i)=>{const h=[74,92,98,98,92,74][i];return `<path d="M${x-7} 52 L${x+7} 52 L${x+4} ${52+h} L${x} ${60+h} L${x-4} ${52+h}Z" fill="${c}"/>`;}).join(''), front:`<path d="${CAP}" fill="${c}"/>`+[[64,62],[78,70],[92,66],[108,66],[122,70],[136,62]].map(([x,y])=>`<path d="M${x-8} 34 L${x+8} 34 L${x+2} ${y} L${x} ${y+4} L${x-2} ${y}Z" fill="${c}"/>`).join('')};
    case 'locsBun': return {back:`<circle cx="100" cy="24" r="20" fill="${c}"/><path d="M100 4 L106 -10 L110 6Z M88 8 L80 -4 L92 4Z" fill="${c}"/>`+[54,146].map(x=>`<path d="M${x-7} 56 L${x+7} 56 L${x+3} 120 L${x} 128 L${x-3} 120Z" fill="${c}"/>`).join(''), front:`<path d="${CAP}" fill="${c}"/>`+[[72,60],[88,66],[104,64],[120,58]].map(([x,y])=>`<path d="M${x-8} 36 L${x+8} 36 L${x+2} ${y} L${x} ${y+4} L${x-2} ${y}Z" fill="${c}"/>`).join('')};
    default: return {back:'', front:''};
  }
}
function face(kind, iris){
  iris = iris || '#7A4520';
  const k = (d,w=4,c=INK)=>`<path class="keep" d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const blush = k('M68 108 l5 -5 M74 108 l5 -5 M80 108 l5 -5',2.2,'#E2626B')+k('M120 108 l5 -5 M126 108 l5 -5 M132 108 l5 -5',2.2,'#E2626B');
  const nose = k('M100 100 l-3 5 h5',2,'#2A1A12');
  const brows = (l)=>k(`M70 ${72-l} L94 ${66-l}`,4.5)+k(`M106 ${66-l} L130 ${72-l}`,4.5);
  const eye = (cx,dir)=>{
    const x=v=>cx+dir*(v-84);
    return `<path class="keep" d="M${x(71)} 86 Q${x(84)} 74 ${x(97)} 86 L${x(96)} 100 Q${x(84)} 106 ${x(72)} 100Z" fill="#FFFFFF"/>`
      + `<ellipse class="keep" cx="${x(85)}" cy="92" rx="8" ry="10.5" fill="${iris}"/><ellipse class="keep" cx="${x(85)}" cy="93" rx="4" ry="6" fill="${INK}"/>`
      + `<circle class="keep" cx="${x(88)}" cy="87.5" r="3.2" fill="#FFFFFF"/><circle class="keep" cx="${x(81.5)}" cy="97" r="1.6" fill="#FFFFFF"/>`
      + k(`M${x(68)} 87 Q${x(84)} 70 ${x(99)} 84`,5.5) + k(`M${x(68)} 87 l${dir*-6} -4`,3);
  };
  const eyes = eye(84,1)+eye(116,-1);
  if(kind==='calm') return brows(-3)+k('M70 94 Q84 102 98 94',4.5)+k('M70 94 l-5 3 M75 98 l-3 5',2.5)+k('M102 94 Q116 102 130 94',4.5)+k('M130 94 l5 3 M125 98 l3 5',2.5)+nose+k('M94 114 Q100 118 106 114',3.5)+blush;
  if(kind==='grin') return brows(3)+eyes+nose+`<path class="keep" d="M89 110 Q100 126 111 110Z" fill="${INK}"/><path class="keep" d="M92 111 h16 l-1 3 h-14z" fill="#FFFFFF"/><path class="keep" d="M94 119 Q100 124 106 119Z" fill="#F07C7C"/>`+blush;
  return brows(0)+eyes+nose+k('M93 113 Q100 118 107 113',3.5)+blush;
}
function arms(o){
  const t=o.top, s=o.skin;
  const L=`<rect x="40" y="126" width="22" height="60" rx="11" fill="${t}"/><circle cx="51" cy="188" r="11" fill="${s}"/>`;

function jor(x,y,s,c){ return `<g transform="translate(${x} ${y}) scale(${s})">${JORDAN(c)}</g>`; }
function stage(build,label,vb='0 0 400 300'){ const id='st'+(sid++); return `<svg class="st" viewBox="${vb}" preserveAspectRatio="xMidYMax meet" role="img" aria-label="${label}"><defs>${pat(id)}</defs><g class="ink-layer">${build(id)}</g></svg>`; }
const FLOOR = `<path class="keep" d="M-60 286 H460" stroke="${INK}" stroke-width="3"/>`;
const DESK = (x=210)=>`<rect x="${x}" y="70" width="150" height="100" rx="8" fill="#0E1A22"/><rect class="keep" x="${x+14}" y="88" width="90" height="8" rx="3" fill="#9BE7EA"/><rect class="keep" x="${x+14}" y="104" width="120" height="8" rx="3" fill="#FFFFFF"/><rect class="keep" x="${x+14}" y="120" width="70" height="8" rx="3" fill="#9BE7EA"/><rect x="${x+66}" y="170" width="18" height="40" fill="#555"/><rect x="-60" y="208" width="520" height="16" rx="4" fill="#8B5A2B"/>`;
const TABLE = `<rect x="70" y="214" width="260" height="14" rx="4" fill="#8B5A2B"/><rect x="190" y="228" width="20" height="58" fill="#6B4226"/><rect class="keep" x="120" y="192" width="22" height="24" rx="4" fill="#FFFFFF" stroke="${INK}" stroke-width="2.5"/><rect class="keep" x="256" y="192" width="22" height="24" rx="4" fill="#FFFFFF" stroke="${INK}" stroke-width="2.5"/>`;
const DOOR = `<rect x="250" y="30" width="130" height="256" fill="#FFFFFF"/><rect class="keep" x="250" y="30" width="60" height="256" fill="#3A3A3A"/><rect class="keep" x="268" y="52" width="94" height="22" fill="#FFFFFF" stroke="${INK}" stroke-width="2"/>`;
function lineup(id){
  const back=['clearline','climber','ticket','doc'], front=['harmony','calm','scout','buddy'];
  let g='';
  back.forEach((k,i)=>{ g+=put(byKey[k].fig,70+i*150,0,0.9,false,id+'h'); });
  front.forEach((k,i)=>{ g+=put(byKey[k].fig,-5+i*150,92,0.9,false,id+'h'); });
  return `<svg viewBox="-40 -30 760 370" role="img" aria-label="The eight warriors standing shoulder to shoulder in two rows"><defs>${stickerFilter(id)}${pat(id+'h')}</defs><g filter="url(#${id})"><g class="ink-layer">${g}</g></g></svg>`;
}
const cp = (cls, cap, art, bals='') => `<div class="cp ${cls}">${cap?`<div class="cap">${cap}</div>`:''}${art}${bals}</div>`;
const bal = (txt, pos, tail='dl', extra='') => `<div class="bal ${tail} ${extra}" style="${pos}">${txt}</div>`;

/* ===== avatars removed: every picture spot is now an empty, labeled frame ===== */
let slotN = 0;
function slot(label, cls=''){ slotN++; return `<div class="slot ${cls}" role="img" aria-label="Empty picture spot: ${label}"><span>Picture spot ${slotN}</span><small>${label}</small><em>Credit: see Picture References</em></div>`; }
lineup = function(){ return slot('The crew, standing shoulder to shoulder','wide'); };
stage = function(build, label){ return slot(label, 'fill'); };
fullBody = function(w){ return slot(w.name, 'square'); };

  <div class="kicker">Exclusive</div>
  <h2 class="hed" id="a1-hed">Rookie Analyst Calls In Eight Warriors After Break-Room Ambush</h2>
  <p class="dek">Three weeks into a dream job at Motorola, a new security analyst hears a senior colleague say they “don’t deserve that seat.” Instead of firing back, they assemble a crew.</p>
  <div class="by">By dreezy · Staff Correspondent</div>
  <hr class="rule1">
  <div class="story">
    <figure class="leadfig" style="margin:4px 0 12px 22px"><div class="frame">${lineup('lu1')}</div><figcaption class="cutline">REPORTING FOR DUTY — Back row: Captain Clearline, Climb-Bot, Sir Ticket, Doc Three-Plans. Front row: Host Harmony, Calm Compass, Scout Newday, Dr. Big-Heart.</figcaption></figure>
    <p class="dropcap"><b>CHICAGO —</b> Three weeks into the job of a lifetime, a rookie security analyst learned that the hardest alert to clear isn’t always on the screen.</p>
    <p>dreezy, a graduate of the i.c.stars program, joined Motorola’s Security Operations Center as an entry-level analyst. The assignment: troubleshoot machines and make sure every one of them runs properly and stays clean. The work is fast and technical, and the jump from the classroom to the real job was, by dreezy’s own account, a hard landing.</p>
    <p>Then came the comment. Passing the break room, dreezy overheard a senior analyst say that dreezy had “come out of some program” and did not “deserve that seat.” A couple of people laughed. Nobody noticed dreezy in the hallway.</p>
    <p>What happened next is the reason for this special edition. Rather than storm in or shrink away, dreezy called in a crew: eight warriors who carry five personal strengths and five professional ones, each modeled on a member of the Planet Express crew. Their orders were simple and hard at the same time: protect a reputation without giving up an ounce of professionalism.</p>
    <p>The full account, including who was called and why, begins on Page A2. The crew’s first mission is retold in The Funnies on Page C1.</p>

    <div><div class="by">Staff Correspondent and Director</div><p class="corr-name">dreezy</p><p class="corr-bio">Tier 1 SOC analyst at Motorola and graduate of the i.c.stars cycle. Covers the alert queue, the break room and everything in between.</p></div>
  </div>
  <hr class="rule1">
  <div class="cols">
    <h3>Scene one: the setting</h3>
    <p class="dropcap">Every hero story starts with a costume change. For dreezy, it was trading the supportive classroom of the i.c.stars cycle for a badge at Motorola’s Security Operations Center. The title was entry-level SOC analyst. The responsibility was to troubleshoot machines, keep every one working properly, and make sure it was clean. It was the dream job. It was also a cold plunge.</p>
    <h3>Scene two: a day on the watch</h3>
    <p>A shift opens with a handoff, as the outgoing analyst walks through open incidents. Then comes the alert queue: warnings from the security tools, phishing emails reported by coworkers, laptops that suddenly act strange. Each alert is sorted as a false alarm, harmless, or suspicious, and every one gets a ticket. dreezy went heads-down, learning on the fly, and like any new Tier 1 analyst, made the occasional mistake.</p>
    <h3>Scene three: the microscope</h3>
    <p>The trouble started quietly. In a team meeting, it came up that dreezy had arrived through i.c.stars rather than a traditional computer-science degree. Jordan, a senior analyst, went cold. He began re-checking dreezy’s tickets. When dreezy misclassified a single alert, Jordan didn’t send a private message. He called it out in the team channel, where everyone could see.</p>
    <h3>Scene four: the ambush</h3>
    <p>Days later, dreezy walked past the break room and heard it plainly.</p>
    <div class="pull">“They came out of some program. They don’t deserve that seat. I check everything they touch.”<small>Jordan, overheard</small></div>
    <p>The moment lands like a jump cut. The face goes hot. The first instinct is to walk in and prove him wrong on the spot. A director would freeze the frame right here, because what happens next decides the whole movie.</p>
    <h3>Scene five: assembling the warriors</h3>
    <p>Instead of reacting, dreezy assembled a crew. Each member is a strength dreezy already carries, given a name, a face and a job. Each one also has a weak spot, so every soldier needs armor from another.</p>
    <div class="roster">${CREW.map(([k,n,t,c,kind,does,weak,armor])=>`<div><b>${n}</b> (${t}; the ${c} role, ${kind.toLowerCase()}). <i>Brings:</i> ${does} <i>Watch out:</i> ${weak} <i>Armor:</i> ${armor}.</div>`).join('')}</div>
    <p>The crew deploys in balanced pairs, so one soldier’s strength covers the other’s blind spot: <b>The Voice</b> (Captain Clearline and Host Harmony), <b>The Compass</b> (Climb-Bot and Calm Compass), <b>The Launchpad</b> (Sir Ticket and Scout Newday), and <b>The Lab</b> (Doc Three-Plans and Dr. Big-Heart).</p>
    <h3>Scene six: what’s at stake</h3>
    <p>The goal was never to win an argument. Victory means respect, a clear boundary and room to grow. Before moving, the crew agreed on three things they would not do: gossip back, explode in the moment, or doubt the work. How the plan played out is told in The Funnies on Page C1, along with the box score of every move.</p>
  </div>
  <hr class="rule2">
  <div class="split">
    <div class="playbill">
      <h3>The Cast</h3><div class="sub">In order of appearance</div>

        <li><span><b>Jordan</b></span><span>Senior analyst, the critic</span></li>
        ${CREW.map(([k,n,t,c])=>`<li><span><b>${n}</b></span><span>${t} · the ${c} role</span></li>`).join('')}
      </ul>
    </div>
    <div class="script" aria-label="Director's notes, screenplay excerpt">
      <div class="slug">Int. Motorola SOC, hallway by the break room · 2:14 p.m.</div>
      <div class="dir">Fluorescent hum. DREEZY, locs pulled back, headset around the neck, walks past a half-open door with a coffee.</div>
      <div class="char">Jordan (o.s.)</div><div class="line">They came out of some program. They don’t deserve that seat.</div>
      <div class="dir">Laughter behind the door. Dreezy stops. The coffee trembles.</div>
      <div class="char">Climb-Bot (v.o.)</div><div class="line">Let me at him.</div>
      <div class="char">Calm Compass (v.o.)</div><div class="line">Not yet. Breathe. We don’t answer from hurt.</div>
      <div class="dir">Dreezy exhales and keeps walking. Hold on the doorway.</div>
      <div class="trans">Cut to: The Funnies, Page C1.</div>
    </div>
  </div>
</article>`;
